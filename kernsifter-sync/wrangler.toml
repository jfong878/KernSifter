name = "kernsifter-sync"
main = "src/index.ts"
compatibility_date = "2026-10-13"

# Static client is served as Workers assets. run_worker_first is required so
# /auth/freebuff/* reaches the Worker before the asset handler.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[observability]
enabled = true

[vars]
# Public configuration, not secrets. Fill FREEBUFF_CLIENT_ID from:
#   npx @freebuff/auth register --project kernsifter --name "KernSifter" \
#     --environment production --redirect-uri <origin>/auth/freebuff/callback
FREEBUFF_CLIENT_ID = "REPLACE_ME"
APP_ORIGIN = "REPLACE_ME"

# Origins the Tauri webview may call this API from. A webview is a browser, so
# its calls are cross-origin and need CORS; these are the shell's own origins.
# Deliberately an allowlist and never `*`: POST /api/device/authorize needs no
# credential, so an open policy would let any page mint a device code, hand the
# victim a user code, and redeem the approval for itself. Add a local dev-server
# origin here only if you run the frontend in a real browser.
ALLOWED_WEBVIEW_ORIGINS = "http://tauri.localhost,https://tauri.localhost,tauri://localhost"

# Structured sync state.
[[d1_databases]]
binding = "SYNC_DB"
database_name = "kernsifter-sync-db"
database_id = "00000000-0000-0000-0000-000000000000"

# Payload blobs, keyed by owner.
[[r2_buckets]]
binding = "FILES"
bucket_name = "kernsifter-sync-files"
